  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

ceholder-val=\"{{ false }}\">\n              <div style=\"display:flex;align-items:center;gap:10px;margin-bottom:14px;\">\n                <span style=\"font-size:26px;\">{{ selectedIcon }}<\u002Fspan>\n                <span style=\"font-weight:800;font-size:clamp(18px,2.4vw,26px);letter-spacing:-.01em;\">{{ selectedName }}<\u002Fspan>\n              <\u002Fdiv>\n              <div ref=\"{{ lensRef }}\" style=\"position:relative;width:min(72vw,440px);aspect-ratio:1/1;border-radius:50%;overflow:hidden;background:radial-gradient(circle at 38% 32%,#fbfdff,#dfe7f0 78%,#cdd7e2);box-shadow:0 0 0 10px #fff,0 0 0 12px #c5cfdb,0 18px 40px rgba(20,30,45,.22),inset 0 0 60px rgba(47,74,107,.10);\">\n                <svg viewBox=\"0 0 600 600\" width=\"100%\" height=\"100%\" style=\"display:block;\">\n                  <sc-for list=\"{{ circles }}\" as=\"c\" hint-placeholder-count=\"0\">\n                    <circle cx=\"{{ c.cx }}\" cy=\"{{ c.cy }}\" r=\"{{ c.r }}\" fill=\"{{ c.fill }}\" stroke=\"{{ c.stroke }}\" stroke-width=\"{{ c.sw }}\"><\u002Fcircle>\n                  <\u002Fsc-for>\n                <\u002Fsvg>\n                <div style=\"position:absolute;inset:0;border-radius:50%;pointer-events:none;box-shadow:inset 0 0 50px rgba(20,30,45,.16);\"><\u002Fdiv>\n                <div style=\"position:absolute;top:13%;left:16%;width:30%;height:18%;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.55),transparent 70%);pointer-events:none;\"><\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:#8a929a;margin-top:14px;letter-spacing:.04em;\">particle view · what's the smallest repeating unit?<\u002Fdiv>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ noSelection }}\" hint-placeholder-val=\"{{ true }}\">\n              <div style=\"width:min(72vw,440px);aspect-ratio:1/1;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:radial-gradient(circle at 38% 32%,#fafcff,#e4eaf1 80%);box-shadow:0 0 0 10px #fff,0 0 0 12px #d3dbe4,inset 0 0 50px rgba(47,74,107,.07);color:#8a929a;padding:30px;\">\n                <div style=\"font-size:46px;margin-bottom:14px;opacity:.5;\">🔬<\u002Fdiv>\n                <div style=\"font-weight:700;font-size:17px;color:#5b6672;max-width:18ch;line-height:1.3;\">Pick a sample below to slide it under the lens<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n\n          <!-- QUESTION PANEL -->\n          <div style=\"align-self:stretch;display:flex;flex-direction:column;justify-content:center;min-height:0;\">\n            <sc-if value=\"{{ noSelection }}\" hint-placeholder-val=\"{{ true }}\">\n              <div style=\"background:#fff;border:1px solid #e7ebef;border-radius:16px;padding:22px;box-shadow:0 3px 12px rgba(20,30,45,.04);\">\n                <div style=\"font-weight:800;font-size:18px;margin-bottom:14px;\">How to sort a sample<\u002Fdiv>\n                <div style=\"display:flex;flex-direction:column;gap:12px;font-size:13.5px;color:#4a5562;line-height:1.45;\">\n                  <div><b style=\"color:#2f4a6b;\">All particles identical?<\u002Fb> → Pure substance. One kind of atom = element; two or more bonded = compound.<\u002Fdiv>\n                  <div><b style=\"color:#2f4a6b;\">More than one kind of particle?<\u002Fb> → Mixture. Evenly spread = homogeneous; clumped &amp; uneven = heterogeneous.<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n\n            <sc-if value=\"{{ hasSelection }}\" hint-placeholder-val=\"{{ false }}\">\n              <div ref=\"{{ panelRef }}\" style=\"background:#fff;border:1px solid #e7ebef;border-radius:16px;padding:22px;box-shadow:0 4px 16px rgba(20,30,45,.07);\">\n                <div style=\"font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:#8a929a;margin-bottom:4px;\">{{ stepKicker }}<\u002Fdiv>\n                <div style=\"font-weight:800;font-size:clamp(19px,2.4vw,24px);letter-spacing:-.01em;margin-bottom:18px;line-height:1.2;\">{{ question }}<\u002Fdiv>\n\n                <div style=\"display:flex;flex-direction:column;gap:11px;\">\n                  <sc-for list=\"{{ choices }}\" as=\"ch\" hint-placeholder-count=\"2\">\n                    <button onclick=\"{{ ch.onClick }}\" disabled=\"{{ ch.disabled }}\" style=\"{{ ch.style }}\">\n                      <span style=\"font-size:22px;flex:none;\">{{ ch.emoji }}<\u002Fspan>\n                      <span style=\"display:flex;flex-direction:column;align-items:flex-start;gap:2px;\">\n                        <span style=\"font-weight:700;font-size:15.5px;line-height:1.15;white-space:nowrap;\">{{ ch.title }}<\u002Fspan>\n                        <span style=\"font-weight:400;font-size:12px;line-height:1.25;opacity:.75;\">{{ ch.hint }}<\u002Fspan>\n                      <\u002Fspan>\n                    <\u002Fbutton>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n\n                <sc-if value=\"{{ hasFeedback }}\" hint-placeholder-val=\"{{ false }}\">\n                  <div style=\"{{ feedbackStyle }}\">\n                    <span style=\"font-weight:800;flex:none;\">{{ feedbackTag }}<\u002Fspan>\n                    <span style=\"line-height:1.4;\">{{ feedbackMsg }}<\u002Fspan>\n                  <\u002Fdiv>\n                <\u002Fsc-if>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <!-- TRAY -->\n        <div style=\"margin-top:14px;background:#fff;border:1px solid #e7ebef;border-radius:16px 16px 0 0;border-bottom:none;padding:13px 16px 16px;box-shadow:0 -3px 14px rgba(20,30,45,.05);\">\n          <div style=\"display:flex;align-items:center;gap:8px;margin-bottom:11px;\">\n            <span style=\"font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#8a929a;font-weight:700;\">Sample tray<\u002Fspan>\n            <span style=\"font-size:11px;color:#b3bcc4;\">— tap one to examine it<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px;\">\n            <sc-for list=\"{{ tray }}\" as=\"o\" hint-placeholder-count=\"20\">\n              <button onclick=\"{{ o.onClick }}\" disabled=\"{{ o.disabled }}\" style=\"{{ o.style }}\">\n                <span style=\"font-size:20px;flex:none;\">{{ o.icon }}<\u002Fspan>\n                <span style=\"font-size:11.5px;font-weight:600;text-align:left;line-height:1.15;overflow:hidden;\">{{ o.name }}<\u002Fspan>\n                <sc-if value=\"{{ o.done }}\" hint-placeholder-val=\"{{ false }}\">\n                  <span style=\"position:absolute;top:4px;right:5px;font-size:11px;color:#4a8a3f;font-weight:800;\">✓<\u002Fspan>\n                <\u002Fsc-if>\n              <\u002Fbutton>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <!-- ============ RESULTS SCREEN ============ -->\n    <sc-if value=\"{{ isResults }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 20px;text-align:center;animation:mzoom .45s ease;\">\n        <div style=\"font-size:54px;margin-bottom:8px;\">{{ resultEmoji }}<\u002Fdiv>\n        <div style=\"font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:#2f4a6b;font-weight:700;margin-bottom:8px;\">Lab complete<\u002Fdiv>\n        <h1 style=\"font-size:clamp(28px,4.5vw,44px);font-weight:800;letter-spacing:-.02em;margin:0 0 8px;\">{{ resultHeadline }}<\u002Fh1>\n        <p style=\"font-size:16px;color:#4a5562;margin:0 0 26px;max-width:46ch;line-height:1.5;\">{{ resultSub }}<\u002Fp>\n\n        <div style=\"display:flex;gap:14px;flex-wrap:wrap;justify-content:center;margin-bottom:30px;\">\n          <div style=\"background:#fff;border:1px solid #e7ebef;border-radius:14px;padding:18px 26px;min-width:130px;box-shadow:0 3px 12px rgba(20,30,45,.04);\">\n            <div style=\"font-weight:800;font-size:34px;color:#2f4a6b;line-height:1;\">{{ score }}<\u002Fdiv>\n            <div style=\"font-size:12px;color:#8a929a;margin-top:5px;font-weight:600;\">of {{ maxScore }} points<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"background:#fff;border:1px solid #e7ebef;border-radius:14px;padding:18px 26px;min-width:130px;box-shadow:0 3px 12px rgba(20,30,45,.04);\">\n            <div style=\"font-weight:800;font-size:34px;color:#4a8a3f;line-height:1;\">{{ perfectCount }}<\u002Fdiv>\n            <div style=\"font-size:12px;color:#8a929a;margin-top:5px;font-weight:600;\">flawless sorts (of 20)<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"background:#fff;border:1px solid #e7ebef;border-radius:14px;padding:18px 26px;min-width:130px;box-shadow:0 3px 12px rgba(20,30,45,.04);\">\n            <div style=\"font-weight:800;font-size:34px;color:#1a2330;line-height:1;\">{{ accuracy }}%<\u002Fdiv>\n            <div style=\"font-size:12px;color:#8a929a;margin-top:5px;font-weight:600;\">accuracy<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <button onclick=\"{{ start }}\" style=\"padding:15px 36px;border:none;background:#2f4a6b;border-radius:12px;font-weight:700;font-size:17px;color:#fff;cursor:pointer;font-family:inherit;box-shadow:0 6px 18px rgba(47,74,107,.28);\">Play Again — New Samples<\u002Fbutton>\n\n        <a href=\"https://tobinscience.com\" target=\"_blank\" rel=\"noopener\" style=\"display:flex;align-items:center;justify-content:center;gap:13px;text-decoration:none;margin-top:34px;padding-top:26px;border-top:1px solid #e2e7ec;\">\n          <img ref=\"{{ logoRef }}\" alt=\"Tobin Science\" style=\"height:54px;width:54px;flex:none;border-radius:12px;box-shadow:0 3px 10px rgba(20,30,45,.12);background:#eef1f4;\">\n          <div style=\"text-align:left;line-height:1.16;\">\n            <div style=\"font-weight:600;font-size:12px;color:#5b6672;\">Find more great resources at<\u002Fdiv>\n            <div style=\"font-weight:800;font-size:20px;color:#1b3a5b;letter-spacing:-.01em;\">Tobin<span style=\"color:#4a8a3f;\">Science<\u002Fspan>.com<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fa>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n  <\u002Fmain>\n\n  <footer style=\"text-align:center;padding:13px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:#9aa3ab;border-top:1px solid #e6ebef;background:#fff;\">\n    Classification of Matter · created for middle-school science · <a href=\"https://tobinscience.com\" target=\"_blank\" rel=\"noopener\" style=\"color:#4a8a3f;font-weight:700;text-decoration:none;\">TobinScience.com<\u002Fa>\n  <\u002Ffooter>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:&quot;100%&quot;,&quot;height&quot;:760}}\">\nclass Component extends DCLogic {\n  state = {\n    screen: 'start', catalog: null, logo: '',\n    score: 0, objects: [], doneCount: 0,\n    selectedIdx: null, step: 0, pureChoice: null,\n    circles: [], feedback: null, stepClean: true, mistakeThisItem: false\n  };\n\n  _logoEls = [];\n  logoRef = (el) => {\n    if (el) { this._logoEls.push(el); if (this.state.logo) el.src = this.state.logo; }\n  };\n  applyLogo() {\n    if (!this.state.logo) return;\n    this._logoEls.forEach(el => { if (el && el.isConnected && !el.src) el.src = this.state.logo; });\n  }\n  async componentDidMount() {\n    const url = (window.__resources && window.__resources.gamedataMod) || './gamedata.js';\n    const m = await import(url);\n    this.setState({ catalog: m.CATALOG, logo: m.LOGO }, () => this.applyLogo());\n  }\n\n  componentDidUpdate() {\n    this.applyLogo();\n    if (this._lastSel !== this.state.selectedIdx) {\n      this._lastSel = this.state.selectedIdx;\n      if (this.state.selectedIdx != null && this.lensEl) {\n        this.lensEl.style.animation = 'none';\n        void this.lensEl.offsetWidth;\n        this.lensEl.style.animation = 'mzoom .42s ease';\n      }\n    }\n  }\n\n  /* ---------- particle diagram ---------- */\n  shapeAtoms(spec) {\n    const c = spec.colors || [spec.color];\n    switch (spec.shape) {\n      case 'mono': return [{dx:0,dy:0,r:15,color:c[0]}];\n      case 'di':   return [{dx:-9,dy:0,r:14,color:c[0]},{dx:9,dy:0,r:14,color:c[0]}];\n      case 'AB':   return [{dx:0,dy:0,r:15,color:c[0]},{dx:19,dy:0,r:10,color:c[1]}];\n      case 'AB2':  return [{dx:0,dy:0,r:15,color:c[0]},{dx:-15,dy:12,r:10,color:c[1]},{dx:15,dy:12,r:10,color:c[1]}];\n      case 'AB3':  return [{dx:0,dy:0,r:15,color:c[0]},{dx:0,dy:-19,r:9,color:c[1]},{dx:17,dy:11,r:9,color:c[1]},{dx:-17,dy:11,r:9,color:c[1]}];\n      case 'AB4':  return [{dx:0,dy:0,r:15,color:c[0]},{dx:0,dy:-19,r:9,color:c[1]},{dx:18,dy:6,r:9,color:c[1]},{dx:-18,dy:6,r:9,color:c[1]},{dx:0,dy:20,r:9,color:c[1]}];\n      case 'ABC':  return [{dx:0,dy:0,r:15,color:c[0]},{dx:-17,dy:-5,r:10,color:c[1]},{dx:16,dy:9,r:9,color:c[2]}];\n      case 'A2B':  return [{dx:0,dy:0,r:13,color:c[1]},{dx:-15,dy:5,r:12,color:c[0]},{dx:15,dy:5,r:12,color:c[0]}];\n      default:     return [{dx:0,dy:0,r:15,color:c[0]}];\n    }\n  }\n  specsFor(item) {\n    if (item.type === 'element' || item.type === 'compound') return [item.spec];\n    return item.spec.species;\n  }\n  buildParticles(item) {\n    const S = 600, lo = 95, hi = 505, span = hi - lo;\n    const out = [];\n    const emit = (spec, cx, cy) => {\n      const t = this.shapeAtoms(spec), rot = Math.random() * 6.283;\n      t.forEach(a => {\n        const rx = a.dx*Math.cos(rot) - a.dy*Math.sin(rot);\n        const ry = a.dx*Math.sin(rot) + a.dy*Math.cos(rot);\n        const x = cx + rx, y = cy + ry;\n        out.push({ cx:x, cy:y, r:a.r, fill:a.color, stroke:'rgba(20,30,45,.20)', sw:1.5 });\n        out.push({ cx:x - a.r*0.34, cy:y - a.r*0.34, r:a.r*0.40, fill:'rgba(255,255,255,.5)', stroke:'none', sw:0 });\n      });\n    };\n    const mode = (item.type === 'element' || item.type === 'compound') ? 'pure'\n               : (item.type === 'homogeneous' ? 'homo' : 'hetero');\n    const specs = this.specsFor(item);\n\n    if (mode === 'pure' || mode === 'homo') {\n      const single = specs.length === 1 && this.shapeAtoms(specs[0]).length === 1;\n      const cols = single ? 7 : 6, rows = single ? 7 : 6;\n      const cw = span/cols, ch = span/rows;\n      for (let r = 0; r < rows; r++) for (let cI = 0; cI < cols; cI++) {\n        const jx = (Math.random()-.5)*cw*0.5, jy = (Math.random()-.5)*ch*0.5;\n        const cx = lo + cw*(cI+0.5) + jx, cy = lo + ch*(r+0.5) + jy;\n        if (Math.hypot(cx-300, cy-300) > 215) continue;\n        const spec = mode === 'homo' ? specs[Math.floor(Math.random()*specs.length)] : specs[0];\n        emit(spec, cx, cy);\n      }\n    } else {\n      const n = specs.length;\n      const centers = n === 2\n        ? [[225,300],[375,300]]\n        : [[245,225],[360,235],[300,375]];\n      specs.forEach((spec, i) => {\n        const [ccx, ccy] = centers[i % centers.length];\n        const count = n === 2 ? 15 : 11;\n        for (let k = 0; k < count; k++) {\n          const ang = Math.random()*6.283, rad = Math.random()*78;\n          const cx = ccx + Math.cos(ang)*rad, cy = ccy + Math.sin(ang)*rad;\n          emit(spec, cx, cy);\n        }\n      });\n    }\n    return out;\n  }\n\n  /* ---------- flow ---------- */\n  start = () => {\n    const cat = this.state.catalog || [];\n    const pool = [...cat];\n    for (let i = pool.length - 1; i > 0; i--) { const j = Math.floor(Math.random()*(i+1)); [pool[i],pool[j]]=[pool[j],pool[i]]; }\n    const objects = pool.slice(0, 20).map(item => ({ item, done: false, perfect: false }));\n    this.setState({ screen:'play', score:0, objects, doneCount:0, selectedIdx:null, step:0, pureChoice:null, circles:[], feedback:null, stepClean:true, mistakeThisItem:false });\n  };\n  goHome = () => this.setState({ screen:'start', selectedIdx:null, step:0, feedback:null });\n\n  selectObject(i) {\n    const o = this.state.objects[i];\n    if (!o || o.done) return;\n    this.setState({ selectedIdx:i, step:1, pureChoice:null, feedback:null, stepClean:true, mistakeThisItem:false, circles:this.buildParticles(o.item) });\n  }\n\n  chooseTop(choice) {\n    const item = this.state.objects[this.state.selectedIdx].item;\n    const correct = (item.type === 'element' || item.type === 'compound') ? 'pure' : 'mixture';\n    if (choice === correct) {\n      const add = this.state.stepClean ? 5 : 0;\n      this.setState(s => ({\n        score: s.score + add, step: 2, pureChoice: choice, stepClean: true,\n        feedback: { ok:true, msg: choice === 'pure'\n          ? 'Right — every particle is the same kind, so this is a pure substance.'\n          : 'Right — there is more than one kind of particle here, so this is a mixture.' }\n      }));\n    } else {\n      this.setState({ mistakeThisItem:true, stepClean:false, feedback:{ ok:false, msg: correct === 'mixture'\n        ? 'Look again — the particles are not all the same. More than one kind of particle means it is a mixture.'\n        : 'Look closely — every particle is identical. Only one kind of particle means it is a pure substance.' } });\n    }\n  }\n\n  chooseSub(choice) {\n    const idx = this.state.selectedIdx;\n    const item = this.state.objects[idx].item;\n    if (choice === item.type) {\n      const add = this.state.stepClean ? 5 : 0;\n      const perfect = !this.state.mistakeThisItem;\n      const msgs = {\n        element:'Correct! Only one type of atom, joined to itself — that is an element. ✓',\n        compound:'Correct! Two or more different atoms bonded in every molecule — that is a compound. ✓',\n        homogeneous:'Correct! The particles are mixed evenly and look the same throughout — homogeneous. ✓',\n        heterogeneous:'Correct! The parts are clumped and unevenly mixed — heterogeneous. ✓'\n      };\n      this.setState(s => {\n        const objects = s.objects.map((o,i) => i===idx ? {...o, done:true, perfect} : o);\n        return { score:s.score+add, objects, doneCount:s.doneCount+1, feedback:{ ok:true, done:true, msg:msgs[item.type] } };\n      });\n      setTimeout(() => {\n        this.setState(s => s.doneCount >= 20\n          ? { screen:'results', selectedIdx:null, step:0, feedback:null }\n          : { selectedIdx:null, step:0, feedback:null, pureChoice:null, circles:[] });\n      }, 1350);\n    } else {\n      const wrong = {\n        element:'Look at the colors — every atom is the same type. One kind of atom means it is an element, not a compound.',\n        compound:'Each molecule contains two or more different atoms bonded together. That is a compound, not an element.',\n        homogeneous:'Look again — the different particles are spread evenly all the way through. That is homogeneous.',\n        heterogeneous:'Look again — the parts are clumped into separate areas, not evenly spread. That is heterogeneous.'\n      };\n      this.setState({ mistakeThisItem:true, stepClean:false, feedback:{ ok:false, msg:wrong[item.type] } });\n    }\n  }\n\n  /* ---------- view ---------- */\n  choiceStyle(active) {\n    return 'display:flex;align-items:center;gap:13px;text-align:left;padding:14px 16px;border-radius:12px;border:1.5px solid '\n      + (active ? '#cdd7e2' : '#e2e7ec') + ';background:' + (active ? '#f7f9fb' : '#fff')\n      + ';color:#1a2330;cursor:pointer;font-family:inherit;transition:border-color .15s,background .15s,transform .1s;width:100%;';\n  }\n\n  renderVals() {\n    const s = this.state;\n    const sel = s.selectedIdx != null ? s.objects[s.selectedIdx] : null;\n    const item = sel ? sel.item : null;\n\n    const tray = s.objects.map((o, i) => ({\n      icon: o.item.icon, name: o.item.name, done: o.done,\n      disabled: o.done,\n      onClick: () => this.selectObject(i),\n      style: 'position:relative;display:flex;align-items:center;gap:7px;padding:9px 9px;border-radius:11px;border:1.5px solid '\n        + (o.done ? '#dfeede' : (s.selectedIdx===i ? '#2f4a6b' : '#e2e7ec'))\n        + ';background:' + (o.done ? '#f1f8f0' : '#fff')\n        + ';cursor:' + (o.done ? 'default' : 'pointer')\n        + ';opacity:' + (o.done ? '.62' : '1')\n        + ';font-family:inherit;box-shadow:' + (s.selectedIdx===i && !o.done ? '0 4px 12px rgba(47,74,107,.18)' : '0 1px 3px rgba(20,30,45,.04)') + ';min-height:46px;'\n    }));\n\n    let choices = [], stepKicker = '', question = '';\n    if (item) {\n      if (s.step === 1) {\n        stepKicker = 'Step 1 of 2';\n        question = 'Is this a pure substance or a mixture?';\n        choices = [\n          { emoji:'🔷', title:'Pure substance', hint:'every particle is identical', disabled:false, onClick:()=>this.chooseTop('pure'),   style:this.choiceStyle(false) },\n          { emoji:'🧩', title:'Mixture',         hint:'two or more kinds of particles', disabled:false, onClick:()=>this.chooseTop('mixture'), style:this.choiceStyle(false) }\n        ];\n      } else if (s.step === 2 && s.pureChoice === 'pure') {\n        stepKicker = 'Step 2 of 2 · Pure substance';\n        question = 'Element or compound?';\n        choices = [\n          { emoji:'⚛️', title:'Element',  hint:'one type of atom only', disabled:false, onClick:()=>this.chooseSub('element'),  style:this.choiceStyle(false) },\n          { emoji:'🔗', title:'Compound', hint:'two or more atoms bonded together', disabled:false, onClick:()=>this.chooseSub('compound'), style:this.choiceStyle(false) }\n        ];\n      } else if (s.step === 2 && s.pureChoice === 'mixture') {\n        stepKicker = 'Step 2 of 2 · Mixture';\n        question = 'Homogeneous or heterogeneous?';\n        choices = [\n          { emoji:'🟰', title:'Homogeneous', hint:'evenly mixed, same throughout', disabled:false, onClick:()=>this.chooseSub('homogeneous'),  style:this.choiceStyle(false) },\n          { emoji:'🪨', title:'Heterogeneous', hint:'clumped, uneven, visible parts', disabled:false, onClick:()=>this.chooseSub('heterogeneous'), style:this.choiceStyle(false) }\n        ];\n      }\n    }\n\n    const fb = s.feedback;\n    const feedbackStyle = fb\n      ? 'display:flex;gap:9px;margin-top:16px;padding:13px 15px;border-radius:11px;font-size:13.5px;'\n        + (fb.ok ? 'background:#eef7ec;border:1px solid #cfe6c9;color:#2f6b27;' : 'background:#fdeeee;border:1px solid #f3cfcf;color:#9b3030;animation:mshake .4s ease;')\n      : '';\n\n    const maxScore = 200;\n    const perfectCount = s.objects.filter(o => o.perfect).length;\n    const totalSteps = 40;\n    const accuracy = Math.round((s.score / 5) / totalSteps * 100);\n\n    return {\n      logoRef: this.logoRef,\n      isStart: s.screen === 'start',\n      isPlay: s.screen === 'play',\n      isResults: s.screen === 'results',\n      inPlay: s.screen === 'play',\n      start: this.start, goHome: this.goHome,\n\n      score: s.score,\n      progressLabel: s.doneCount + ' / 20',\n\n      hasSelection: !!item,\n      noSelection: s.screen === 'play' && !item,\n      selectedIcon: item ? item.icon : '',\n      selectedName: item ? item.name : '',\n      circles: s.circles,\n      lensRef: (el) => { this.lensEl = el; },\n      panelRef: () => {},\n\n      stepKicker, question, choices,\n      hasFeedback: !!fb,\n      feedbackStyle,\n      feedbackTag: fb ? (fb.ok ? '✓' : '✕') : '',\n      feedbackMsg: fb ? fb.msg : '',\n\n      tray,\n\n      maxScore, perfectCount, accuracy,\n      resultEmoji: perfectCount >= 17 ? '🏆' : perfectCount >= 11 ? '🎉' : '🔬',\n      resultHeadline: perfectCount >= 17 ? 'Master Chemist!' : perfectCount >= 11 ? 'Nicely sorted!' : 'Lab complete',\n      resultSub: perfectCount >= 17\n        ? 'You read the particle diagrams like a pro. Want a fresh set of samples?'\n        : perfectCount >= 11\n          ? 'Solid work classifying matter. Run it again for 20 brand-new samples.'\n          : 'Every sample is sorted. Review the feedback, then try a new set of samples.'\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
